name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-ci.txt

      - name: Show environment
        run: |
          python -m pip list
          python -m pytest --version

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short -x \
            --cov-config=.coveragerc-unit --cov=custom_components/jullix \
            --cov-report=term-missing --cov-fail-under=65

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy custom_components/jullix --ignore-missing-imports --no-error-summary 2>/dev/null || true
        # Optional: remove "|| true" to fail the job on type errors once baseline is clean

  config-flow-and-entities:
    name: Config flow and entity tests (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Home Assistant and test deps
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant>=2024.12.0" pytest pytest-asyncio pytest-cov aiohttp voluptuous

      - name: Run config flow and entity tests with coverage
        run: |
          python -m pytest tests/test_config_flow.py tests/test_entities.py -v --tb=short \
            --cov=custom_components/jullix --cov-report=term-missing
        # No --cov-fail-under here: this job is the only one that can import entity/sensor
        # platform modules (they need real HA), but only 2 of the test files run here, so a
        # numeric floor isn't representative. The term-missing report still surfaces any
        # new sensor file sitting at 0% in the CI log.

  live-api:
    name: Live API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-ci.txt

      - name: Run live API smoke test
        env:
          JULLIX_API_TOKEN: ${{ secrets.JULLIX_API_TOKEN }}
          JULLIX_INSTALLATION_ID: ${{ secrets.JULLIX_INSTALLATION_ID }}
        run: python -m pytest tests/test_live_api.py -v --tb=short
        # When secrets are not set, tests are skipped (job passes). When set, failures fail the job.
